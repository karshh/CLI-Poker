name: Pre-Merge CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-build-and-test:
    name: docker-build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test stage Docker image
        run: docker build --target build -t high-roller-holdem:test .

      - name: Run tests in Docker container
        run: docker run --rm high-roller-holdem:test npm test

      - name: Build production Docker image
        run: docker build -t high-roller-holdem:latest .

  gui-browser-e2e:
    name: gui-browser-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full headless Chromium GUI E2E suite
        run: npm run test:e2e
